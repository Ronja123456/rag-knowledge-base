server:
  port: 8081

spring:
  application:
    name: local-life-platform
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: 你的数据库密码
  redis:
    host: localhost
    port: 6379
    password: 你的Redis密码
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.hmdp.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.hmdp: debug

deepseek:
  api-key: 你的DeepSeekKey
  base-url: https://api.deepseek.com
  model: deepseek-chat


qwen:
  api-key: 你的通义千问
  embedding-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
  embedding-model: text-embedding-v3
